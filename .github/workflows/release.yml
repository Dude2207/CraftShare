name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p build/CraftShare
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude 'build' ./ build/CraftShare/
          cd build && zip -r "../CraftShare-${GITHUB_REF_NAME}.zip" CraftShare
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "CraftShare-${GITHUB_REF_NAME}.zip" --title "CraftShare ${GITHUB_REF_NAME}" --generate-notes
